<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8000c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAVEX – JUNIOR">
<link rel="manifest" href="manifest.json">

<title>MAVEX – JUNIOR</title>
<style>
:root{--red:#e5232b;--red2:#b9000a;--dark:#11151b;--blue:#214f7d;--ink:#14171b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:var(--ink)}
body{overflow-x:hidden}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.shell{position:relative;width:min(1120px,100%);min-height:720px;overflow:hidden;border-radius:32px;background:linear-gradient(145deg,#fff 0%,#fff 58%,#f0f3f6 100%);box-shadow:0 30px 70px rgba(0,0,0,.18),inset 0 1px 0 #fff}
.shell:before{content:"";position:absolute;width:560px;height:560px;left:-260px;top:-280px;border-radius:50%;background:radial-gradient(circle at 70% 70%,#ff3540 0 3%,transparent 4%),linear-gradient(135deg,#15191e 0 38%,#e5232b 39% 44%,transparent 45%);transform:rotate(-10deg);opacity:.98}
.shell:after{content:"";position:absolute;width:600px;height:600px;right:-310px;bottom:-330px;border-radius:50%;background:linear-gradient(315deg,#15191e 0 37%,#e5232b 38% 43%,transparent 44%);transform:rotate(-8deg)}
.content{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;min-height:720px;padding:58px 64px}
.left{display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:14px;letter-spacing:3px;font-weight:800;color:#666;text-transform:uppercase;margin-bottom:16px}
.logo3d{display:inline-flex;align-self:flex-start;align-items:center;justify-content:center;padding:12px 22px;border-radius:28px;background:linear-gradient(180deg,#ff3b42,#c9000a);border:2px solid #ff5b60;box-shadow:0 12px 0 #7f0007,0 20px 28px rgba(185,0,10,.25),inset 0 2px 3px rgba(255,255,255,.7);transform:perspective(600px) rotateX(5deg);margin-bottom:30px}
.logoText{font-style:italic;font-weight:900;font-size:clamp(30px,5vw,58px);letter-spacing:-3px;color:#fff;text-shadow:0 3px 0 #8e0006,0 5px 7px rgba(0,0,0,.2)}
.auto{font-size:clamp(22px,4vw,42px);font-weight:900;letter-spacing:2px;color:#0c0e11;margin-bottom:4px;text-shadow:0 3px 0 #ddd}
h1{margin:0;font-size:clamp(48px,8vw,92px);line-height:.92;letter-spacing:-4px;font-weight:950;color:#111}
h1 span{color:var(--red);text-shadow:0 5px 0 #8d0007,0 10px 18px rgba(185,0,10,.18)}
.lead{margin:22px 0 0;max-width:620px;font-size:clamp(18px,2.2vw,25px);line-height:1.4;color:#4a4e54}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:15px;width:min(430px,100%);margin-top:32px;padding:20px 26px;border:0;border-radius:18px;background:linear-gradient(180deg,#ff3b42,#c9000a);color:#fff;text-decoration:none;font-size:clamp(19px,2.4vw,26px);font-weight:900;box-shadow:0 9px 0 #850008,0 18px 30px rgba(185,0,10,.28),inset 0 2px 2px rgba(255,255,255,.5);transition:transform .18s,box-shadow .18s}
.cta:hover{transform:translateY(-3px);box-shadow:0 12px 0 #850008,0 22px 35px rgba(185,0,10,.32)}
.cta:active{transform:translateY(5px);box-shadow:0 4px 0 #850008,0 8px 15px rgba(185,0,10,.2)}
.cal{width:34px;height:34px;border:3px solid #fff;border-radius:8px;position:relative}
.cal:before{content:"";position:absolute;left:5px;right:5px;top:9px;border-top:3px solid #fff;box-shadow:0 7px 0 #fff}
.cal:after{content:"";position:absolute;left:5px;right:5px;top:-6px;height:8px;border-left:3px solid #fff;border-right:3px solid #fff}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:35px;max-width:680px}
.feature{padding:15px 10px;border-radius:16px;background:rgba(255,255,255,.78);border:1px solid #e4e6e9;box-shadow:0 8px 20px rgba(0,0,0,.07);text-align:center}
.fi{font-size:25px;color:var(--red);margin-bottom:7px}
.feature b{font-size:12px;line-height:1.2;display:block}
.right{display:flex;align-items:center;justify-content:center;position:relative}
.gauge{width:min(420px,90%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 48%,#f2f3f5 49% 62%,#171a1e 63% 66%,#dfe3e7 67%);box-shadow:20px 25px 45px rgba(0,0,0,.18),inset 0 0 0 12px #fff;position:relative;transform:perspective(800px) rotateY(-12deg) rotateX(7deg)}
.gauge:before{content:"";position:absolute;inset:10%;border-radius:50%;background:repeating-conic-gradient(from -135deg,#222 0deg 1deg,transparent 1deg 7deg);mask:radial-gradient(circle,transparent 0 65%,#000 66%);opacity:.8}
.gauge:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:39%;background:linear-gradient(#e5232b,#8d0007);transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(38deg);border-radius:8px;box-shadow:0 2px 5px #777}
.gauge-center{position:absolute;left:50%;top:50%;width:36px;height:36px;border-radius:50%;background:var(--red);transform:translate(-50%,-50%);box-shadow:0 3px 7px rgba(0,0,0,.3);z-index:2}
.gauge-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:90px;flex-direction:column}
.gauge-label strong{font-size:54px;letter-spacing:-3px}
.gauge-label small{font-weight:800;color:#777;letter-spacing:3px}
.road{position:absolute;bottom:35px;left:10%;width:78%;height:110px;transform:skewY(-10deg);background:linear-gradient(90deg,#d7dbe0,#fff);clip-path:polygon(15% 100%,80% 100%,100% 0,45% 0)}
.road:after{content:"";position:absolute;left:48%;top:0;width:7px;height:100%;background:repeating-linear-gradient(#fff 0 18px,transparent 18px 34px);opacity:.8}
.car{position:absolute;bottom:72px;left:23%;font-size:62px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.2));transform:scaleX(-1)}
.badge{position:absolute;right:3%;top:10%;padding:10px 15px;border-radius:14px;background:#111;color:#fff;font-size:12px;font-weight:900;letter-spacing:1px;box-shadow:0 7px 0 #e5232b,0 12px 20px rgba(0,0,0,.15)}
@media(max-width:850px){
 .shell{min-height:auto;border-radius:24px}.content{grid-template-columns:1fr;min-height:auto;padding:42px 28px 34px}.right{order:-1;height:250px}.gauge{width:235px}.gauge-label strong{font-size:32px}.gauge-label{padding-top:45px}.road{display:none}.car{font-size:38px;bottom:12px;left:18%}.badge{top:5%;right:4%}
 .features{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
 .page{padding:8px}.content{padding:28px 18px 26px}.right{height:220px}.logo3d{padding:9px 15px}.logoText{font-size:31px}.auto{font-size:18px}h1{font-size:48px;letter-spacing:-2px}.lead{font-size:17px}.cta{margin-top:24px;padding:17px 18px}.features{gap:8px;margin-top:24px}.feature{padding:12px 6px}.feature b{font-size:10px}
}
</style>
</head>

</div>

</html>
