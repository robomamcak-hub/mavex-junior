<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAVEX – JUNIOR">
<link rel="manifest" href="manifest.json">
<title>MAVEX – JUNIOR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef1f5;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:18px}
.app{
  position:relative;
  width:min(1100px,100%);
  aspect-ratio:602/479;
  overflow:hidden;
  border-radius:28px;
  background:#fff;
  box-shadow:0 20px 55px rgba(0,0,0,.18);
}
.design{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  user-select:none;
  -webkit-user-drag:none;
}
.real-button{
  position:absolute;
  left:29.5%; top:59.2%;
  width:40.5%; height:12.2%;
  border:0;
  border-radius:18px;
  background:linear-gradient(#ff3b3f,#e60008);
  color:#fff;
  font-size:clamp(14px,2.2vw,30px);
  font-weight:900;
  letter-spacing:.2px;
  box-shadow:0 8px 0 #970008,0 14px 28px rgba(210,0,10,.30);
  cursor:pointer;
  transition:transform .12s ease,filter .12s ease;
  z-index:5;
}
.real-button:hover{filter:brightness(1.05);transform:translateY(-2px)}
.real-button:active{transform:translateY(4px);box-shadow:0 4px 0 #970008,0 8px 18px rgba(210,0,10,.25)}
.real-button span{display:inline-flex;align-items:center;justify-content:center;gap:.45em}
.cal{font-size:1.05em}
.corner-mask-left,.corner-mask-right{
  position:absolute;z-index:4;background:rgba(255,255,255,.96);pointer-events:none;
}
.corner-mask-left{left:0;bottom:0;width:17%;height:9%}
.corner-mask-right{right:0;bottom:0;width:10%;height:8%}
@media(max-width:700px){
  body{padding:6px}
  .app{border-radius:18px}
  .real-button{
    border-radius:10px;
    box-shadow:0 5px 0 #970008,0 9px 18px rgba(210,0,10,.25);
  }
}
@media(max-width:430px){
  body{padding:0;background:#fff}
  .app{width:100%;border-radius:0;box-shadow:none}
  .real-button{font-size:12px}
}
</style>
</head>
<body>
<main class="app" aria-label="MAVEX – JUNIOR">
  <img class="design" src="wau-design.png" alt="MAVEX – JUNIOR – rezervačný kalendár autoškoly">
  <div class="corner-mask-left"></div>
  <div class="corner-mask-right"></div>
  <a class="real-button" href="https://script.google.com/macros/s/AKfycbzIWitrwJs8-ygDerMXPEgmlDk0k4OuRjoG1-pKcpIEB9ou5_uueng8KRyunKplJfBvMA/exec" aria-label="Otvoriť MAVEX – JUNIOR">
    <span><b class="cal">▣</b> OTVORIŤ MAVEX – JUNIOR</span>
  </a>
</main>
<script>
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
</body>
</html>
